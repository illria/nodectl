# User-verified reference; panel URLs and subscription token replaced with test values.
proxy-providers:
  中转机场:
    type: http
    interval: 3600
    url: "https://panel.example/sub/raw/1?token=reference-test-token"
    path: ./proxy_providers/clash-node.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    override:
      udp: true
  落地机场:
    type: http
    interval: 3600
    url: "https://panel.example/sub/raw/2?token=reference-test-token"
    path: ./proxy_providers/exit.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    override:
      udp: true
      dialer-proxy: '💠 中转策略'
      skip-proxy: false

proxies:
    - {name: 🇨🇳 大陆, type: direct, udp: true}
    - {name: ⛔️ 拒绝连接, type: reject}
    - {name: 中转关闭, type: direct, udp: true}

# -------------------- 软件策略通用选项 --------------------
# 软件模块可以选择总模式、手动/地区策略或直连/拒绝，不引用自身或 GLOBAL。

# -------------------- 策略组自动生成 --------------------
