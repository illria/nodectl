name: Test Custom Routing Changes

on:
  push:
    branches:
      - feat/custom-routing-v4

permissions:
  contents: read

concurrency:
  group: test-custom-routing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify prepared Agent version
        run: |
          grep -Fq 'AGENT_VERSION: v0.2.77' .github/workflows/publish-custom-release.yml
          grep -Fq 'nodectl-agent-linux-amd64-v0.2.77' README.md
          grep -Fq 'nodectl-agent-linux-arm64-v0.2.77' README.md

      - name: Run Go tests
        run: go test ./...
