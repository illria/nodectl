name: Sing-box Core Compatibility

on:
  push:
    branches: [feat/singbox-subscriptions-v11, fix/singbox-ios-v12, fix/singbox-modes-v13, fix/singbox-cn-direct-v14, feat/single-provider-v15]
  workflow_call:

permissions:
  contents: read

jobs:
  core-check:
    name: Check sing-box ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: [1.8.14, 1.9.7, 1.10.7, 1.11.3, 1.11.15, 1.12.25, 1.13.21, 1.14.2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Export multi-protocol compatibility fixtures
        env:
          NODECTL_SINGBOX_FIXTURES: ${{ runner.temp }}/singbox-fixtures
        run: |
          mkdir -p "$NODECTL_SINGBOX_FIXTURES"
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/cb3e075825906a4dcc2feff84e3d6cc5691d9416/geo/geosite/cn.list' -o "$NODECTL_SINGBOX_FIXTURES/cn.list"
          export NODECTL_SINGBOX_LARGE_SOURCE="$NODECTL_SINGBOX_FIXTURES/cn.list"
          go test ./internal/service -run 'TestSingBoxCompatibility|TestSingBoxLargeRuleFixture|TestSingBoxDomesticPolicy' -count=1
      - name: Check generated config with official core
        env:
          CORE_VERSION: ${{ matrix.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/singbox-core"
          curl --fail --location --retry 3 "https://github.com/SagerNet/sing-box/releases/download/v${CORE_VERSION}/sing-box-${CORE_VERSION}-linux-amd64.tar.gz" -o "$RUNNER_TEMP/core.tar.gz"
          tar -xzf "$RUNNER_TEMP/core.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/singbox-core"
          CORE_MINOR="${CORE_VERSION%.*}"
          for PROFILE_SUFFIX in '' '-single'; do
            "$RUNNER_TEMP/singbox-core/sing-box" check -c "$RUNNER_TEMP/singbox-fixtures/${CORE_MINOR}${PROFILE_SUFFIX}.json"
            python3 scripts/check_singbox_runtime.py --core "$RUNNER_TEMP/singbox-core/sing-box" --fixture "$RUNNER_TEMP/singbox-fixtures/${CORE_MINOR}${PROFILE_SUFFIX}-mobile.json" --rules "$RUNNER_TEMP/singbox-fixtures/rules.srs" --large-rules "$RUNNER_TEMP/singbox-fixtures/cn.srs"
            python3 scripts/check_singbox_policy.py --core "$RUNNER_TEMP/singbox-core/sing-box" --fixture "$RUNNER_TEMP/singbox-fixtures/${CORE_MINOR}${PROFILE_SUFFIX}-mobile.json"
          done
