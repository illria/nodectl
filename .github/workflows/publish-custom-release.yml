name: Publish Custom Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

env:
  VERSION: v0.4.76-custom.10
  AGENT_VERSION: v0.2.77
  IMAGE: ghcr.io/illria/nodectl

jobs:
  go-test:
    if: "${{ github.event.head_commit.message == 'release: publish v0.4.76-custom.10' }}"
    name: Verify v10 subscriptions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

  build-panel:
    if: "${{ github.event.head_commit.message == 'release: publish v0.4.76-custom.10' }}"
    needs: go-test
    name: Build Panel ${{ matrix.goos }} ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build panel
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-s -w -X 'nodectl/internal/version.Version=${VERSION}'" \
            -o "bin/nodectl-${GOOS}-${GOARCH}${{ matrix.ext }}" ./main.go

      - name: Upload panel artifact
        uses: actions/upload-artifact@v4
        with:
          name: panel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/nodectl-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          retention-days: 1

  build-agent:
    if: "${{ github.event.head_commit.message == 'release: publish v0.4.76-custom.10' }}"
    needs: go-test
    name: Build Agent ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build agent
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          GIT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-8)
          OUT="bin/nodectl-agent-linux-${GOARCH}-${AGENT_VERSION}"
          go build -trimpath -ldflags="-s -w \
            -X 'nodectl/internal/agent.AgentVersion=${AGENT_VERSION}' \
            -X 'nodectl/internal/agent.UpdateRepoOwner=illria' \
            -X 'nodectl/internal/agent.UpdateRepoName=nodectl' \
            -X 'nodectl/internal/agent.GitCommit=${GIT_SHA}' \
            -X 'nodectl/internal/agent.BuildTime=${BUILD_TIME}'" \
            -o "${OUT}" ./cmd/nodectl-agent/main.go
          sha256sum "${OUT}" > "${OUT}.sha256"

      - name: Upload agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.goarch }}
          path: |
            bin/nodectl-agent-linux-${{ matrix.goarch }}-${{ env.AGENT_VERSION }}
            bin/nodectl-agent-linux-${{ matrix.goarch }}-${{ env.AGENT_VERSION }}.sha256
          retention-days: 1

  publish-release:
    if: "${{ github.event.head_commit.message == 'release: publish v0.4.76-custom.10' }}"
    name: Publish GitHub Release
    needs: [build-panel, build-agent]
    runs-on: ubuntu-latest
    steps:
      - name: Download panel binaries
        uses: actions/download-artifact@v4
        with:
          pattern: panel-*
          path: bin
          merge-multiple: true

      - name: Download agent binaries
        uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          path: bin
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: NodeCTL Custom ${{ env.VERSION }}
          body: |
            illria/nodectl 独立维护版，基于上游 NodeCTL v0.4.76。

            ### v0.4.76-custom.10
            - 对照用户验证正常的 no-resolve YAML，保留客户端中转、策略组顺序与落地 dialer-proxy
            - 内置 IP RuleSet 和 GEOIP 保留 no-resolve，自定义直连、WebRTC、外部 classical 模块及自定义分流规则集补齐 no-resolve
            - 保持参考配置的五个顶层区块，不下发 DNS/TUN/IPv6/Sniffer 等客户端运行时参数
            - 订阅接口新增禁缓存响应与 X-NodeCTL-Version，防止更新后继续使用缓存的旧模板
            - 新增脱敏参考 YAML 对照测试、全部规则集解析保护测试及真实订阅接口测试，发布前执行完整 Go 测试
            - Agent 保持 v0.2.77，本版无需升级 Agent

            升级后请在客户端更新完整 Clash 订阅并重新加载配置，订阅地址无需更换。
            no-resolve 防止规则匹配触发额外解析；实际 DNS 出口仍取决于客户端 DNS/TUN 设置，需在客户端复测。

            ### Docker
            `ghcr.io/illria/nodectl:v0.4.76-custom.10`

            也提供：
            - `ghcr.io/illria/nodectl:latest`
            - `ghcr.io/illria/nodectl:custom`
          files: bin/*
          draft: false
          prerelease: false
          generate_release_notes: false

  publish-image:
    if: "${{ github.event.head_commit.message == 'release: publish v0.4.76-custom.10' }}"
    name: Publish Docker Image
    needs: build-panel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux panel binaries
        uses: actions/download-artifact@v4
        with:
          pattern: panel-linux-*
          path: bin
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x bin/nodectl-linux-amd64 bin/nodectl-linux-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:custom
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
