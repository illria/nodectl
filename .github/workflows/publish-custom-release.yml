name: Publish Custom Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

env:
  VERSION: v0.4.76-custom.17
  AGENT_VERSION: v0.2.77
  IMAGE: ghcr.io/illria/nodectl

jobs:
  go-test:
    if: "${{ github.event.head_commit.message == 'release: publish v0.4.76-custom.17' }}"
    name: Verify v16 subscriptions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check subscription modal links and controls
        run: |
          npm install --prefix "$RUNNER_TEMP/sub-ui" --ignore-scripts --no-audit --no-fund jsdom@26.1.0
          NODECTL_UI_TEST_MODULES="$RUNNER_TEMP/sub-ui/node_modules" node scripts/check_subscription_ui.cjs

  singbox-check:
    if: "${{ github.event.head_commit.message == 'release: publish v0.4.76-custom.17' }}"
    uses: ./.github/workflows/singbox-compatibility.yml

  build-panel:
    if: "${{ github.event.head_commit.message == 'release: publish v0.4.76-custom.17' }}"
    needs: [go-test, singbox-check]
    name: Build Panel ${{ matrix.goos }} ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build panel
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-s -w -X 'nodectl/internal/version.Version=${VERSION}'" \
            -o "bin/nodectl-${GOOS}-${GOARCH}${{ matrix.ext }}" ./main.go

      - name: Upload panel artifact
        uses: actions/upload-artifact@v4
        with:
          name: panel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/nodectl-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          retention-days: 1

  build-agent:
    if: "${{ github.event.head_commit.message == 'release: publish v0.4.76-custom.17' }}"
    needs: [go-test, singbox-check]
    name: Build Agent ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build agent
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          GIT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-8)
          OUT="bin/nodectl-agent-linux-${GOARCH}-${AGENT_VERSION}"
          go build -trimpath -ldflags="-s -w \
            -X 'nodectl/internal/agent.AgentVersion=${AGENT_VERSION}' \
            -X 'nodectl/internal/agent.UpdateRepoOwner=illria' \
            -X 'nodectl/internal/agent.UpdateRepoName=nodectl' \
            -X 'nodectl/internal/agent.GitCommit=${GIT_SHA}' \
            -X 'nodectl/internal/agent.BuildTime=${BUILD_TIME}'" \
            -o "${OUT}" ./cmd/nodectl-agent/main.go
          sha256sum "${OUT}" > "${OUT}.sha256"

      - name: Upload agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.goarch }}
          path: |
            bin/nodectl-agent-linux-${{ matrix.goarch }}-${{ env.AGENT_VERSION }}
            bin/nodectl-agent-linux-${{ matrix.goarch }}-${{ env.AGENT_VERSION }}.sha256
          retention-days: 1

  publish-release:
    if: "${{ github.event.head_commit.message == 'release: publish v0.4.76-custom.17' }}"
    name: Publish GitHub Release
    needs: [build-panel, build-agent]
    runs-on: ubuntu-latest
    steps:
      - name: Download panel binaries
        uses: actions/download-artifact@v4
        with:
          pattern: panel-*
          path: bin
          merge-multiple: true

      - name: Download agent binaries
        uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          path: bin
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: NodeCTL Custom ${{ env.VERSION }}
          body: |
            illria/nodectl 独立维护版，基于上游 NodeCTL v0.4.76。

            ### v0.4.76-custom.17
            - 补齐“🇨🇳 大陆”及中转关闭直连出口的 IPv4 内部解析策略
            - 1.8～1.12 实际内核的仅 IPv4 完整配置启用域名恢复：识别 HTTP Host / TLS SNI，将应用传入的 IPv6 字面地址恢复为域名后重新解析为 IPv4
            - 1.13 / 1.14 已移除旧版入站改写功能；这些版本继续提供仅 IPv4 DNS，但不能自动恢复应用缓存或自行获取的 IPv6 地址
            - 订阅分发中心明确显示各内核的域名恢复能力和限制；选择订阅版本不会替换客户端实际内核
            - 保留双栈 TUN 接管、国内直连/国外代理、加密 DNS 出口和缓存隔离，不自动改用代理
            - 八个真实内核对两种订阅结构执行 IPv4/双栈路由/DNS 测试；旧版另测 HTTP Host/TLS SNI 下的 IPv6 地址恢复，并对照关闭恢复时的失败
            - 配置片段、Clash、Base64 和 Agent 无需变更

            需要修复应用缓存 IPv6 地址的直连时，请先使用 1.11 / 1.12 实际内核，再在订阅中心选择匹配内核、“手机完整 VPN”和“仅 IPv4”，刷新订阅并重启 VPN。1.11 系列建议使用 1.11.3+。
            无可识别域名、ECH 隐藏域名或仅有 IPv6 地址的目标仍需要可用的 IPv6 网络。1.13 / 1.14 不能使用已移除的恢复功能。
            CI 为 Linux loopback 路由/DNS 测试，不能代替 iOS 实机测试。

            ### Docker
            `ghcr.io/illria/nodectl:v0.4.76-custom.17`

            也提供：
            - `ghcr.io/illria/nodectl:latest`
            - `ghcr.io/illria/nodectl:custom`
          files: bin/*
          draft: false
          prerelease: false
          generate_release_notes: false

  publish-image:
    if: "${{ github.event.head_commit.message == 'release: publish v0.4.76-custom.17' }}"
    name: Publish Docker Image
    needs: build-panel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux panel binaries
        uses: actions/download-artifact@v4
        with:
          pattern: panel-linux-*
          path: bin
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x bin/nodectl-linux-amd64 bin/nodectl-linux-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:custom
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
