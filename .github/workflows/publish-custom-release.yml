name: Publish Custom Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

env:
  VERSION: v0.4.76-custom.15
  AGENT_VERSION: v0.2.77
  IMAGE: ghcr.io/illria/nodectl

jobs:
  go-test:
    if: "${{ github.event.head_commit.message == 'release: publish v0.4.76-custom.15' }}"
    name: Verify v15 subscriptions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check subscription modal links and controls
        run: |
          npm install --prefix "$RUNNER_TEMP/sub-ui" --ignore-scripts --no-audit --no-fund jsdom@26.1.0
          NODECTL_UI_TEST_MODULES="$RUNNER_TEMP/sub-ui/node_modules" node scripts/check_subscription_ui.cjs

  singbox-check:
    if: "${{ github.event.head_commit.message == 'release: publish v0.4.76-custom.15' }}"
    uses: ./.github/workflows/singbox-compatibility.yml

  build-panel:
    if: "${{ github.event.head_commit.message == 'release: publish v0.4.76-custom.15' }}"
    needs: [go-test, singbox-check]
    name: Build Panel ${{ matrix.goos }} ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build panel
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-s -w -X 'nodectl/internal/version.Version=${VERSION}'" \
            -o "bin/nodectl-${GOOS}-${GOARCH}${{ matrix.ext }}" ./main.go

      - name: Upload panel artifact
        uses: actions/upload-artifact@v4
        with:
          name: panel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/nodectl-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          retention-days: 1

  build-agent:
    if: "${{ github.event.head_commit.message == 'release: publish v0.4.76-custom.15' }}"
    needs: [go-test, singbox-check]
    name: Build Agent ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build agent
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          GIT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-8)
          OUT="bin/nodectl-agent-linux-${GOARCH}-${AGENT_VERSION}"
          go build -trimpath -ldflags="-s -w \
            -X 'nodectl/internal/agent.AgentVersion=${AGENT_VERSION}' \
            -X 'nodectl/internal/agent.UpdateRepoOwner=illria' \
            -X 'nodectl/internal/agent.UpdateRepoName=nodectl' \
            -X 'nodectl/internal/agent.GitCommit=${GIT_SHA}' \
            -X 'nodectl/internal/agent.BuildTime=${BUILD_TIME}'" \
            -o "${OUT}" ./cmd/nodectl-agent/main.go
          sha256sum "${OUT}" > "${OUT}.sha256"

      - name: Upload agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.goarch }}
          path: |
            bin/nodectl-agent-linux-${{ matrix.goarch }}-${{ env.AGENT_VERSION }}
            bin/nodectl-agent-linux-${{ matrix.goarch }}-${{ env.AGENT_VERSION }}.sha256
          retention-days: 1

  publish-release:
    if: "${{ github.event.head_commit.message == 'release: publish v0.4.76-custom.15' }}"
    name: Publish GitHub Release
    needs: [build-panel, build-agent]
    runs-on: ubuntu-latest
    steps:
      - name: Download panel binaries
        uses: actions/download-artifact@v4
        with:
          pattern: panel-*
          path: bin
          merge-multiple: true

      - name: Download agent binaries
        uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          path: bin
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: NodeCTL Custom ${{ env.VERSION }}
          body: |
            illria/nodectl 独立维护版，基于上游 NodeCTL v0.4.76。

            ### v0.4.76-custom.15
            - 订阅分发中心新增“单节点池（无中转）”版本，Clash / sing-box / Base64 均可生成对应链接
            - 对照用户的一 provider 参考配置：Clash 只订阅落地节点，保留软件/地区策略组，去掉中转策略与 dialer-proxy
            - sing-box 单池节点不含中转 detour；继续适配 1.8～1.14，手机完整 VPN、桌面完整配置和 outbounds 片段
            - Base64 单池版本只包含落地节点链接；该格式无法携带策略组、分流规则或 VPN 设置
            - 保留 custom.14 的国内默认直连、加密 DNS 分流、低内存 SRS 及 Rule / Global / Direct 模式
            - 原有订阅链接继续使用现有中转/落地结构；Agent 保持 v0.2.77
            - 验证三类节点来源及禁用/屏蔽过滤、桌面/手机界面的链接/二维码/导入同步，并对八个真实内核测试两种配置

            更新面板后，进入“订阅分发中心 → 订阅版本 → 单节点池（无中转）”，重新复制或扫描链接导入。
            单池版本仅使用路由类型为“落地”的自建、机场和自定义节点。手机 sing-box 请选“手机完整 VPN”。
            CI 为 Linux loopback 路由/DNS 测试，不能代替 iOS 实机测试。

            ### Docker
            `ghcr.io/illria/nodectl:v0.4.76-custom.15`

            也提供：
            - `ghcr.io/illria/nodectl:latest`
            - `ghcr.io/illria/nodectl:custom`
          files: bin/*
          draft: false
          prerelease: false
          generate_release_notes: false

  publish-image:
    if: "${{ github.event.head_commit.message == 'release: publish v0.4.76-custom.15' }}"
    name: Publish Docker Image
    needs: build-panel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux panel binaries
        uses: actions/download-artifact@v4
        with:
          pattern: panel-linux-*
          path: bin
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x bin/nodectl-linux-amd64 bin/nodectl-linux-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:custom
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
