name: Publish Custom Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

env:
  VERSION: v0.4.76-custom.1
  IMAGE: ghcr.io/illria/nodectl

jobs:
  build-binaries:
    if: github.event.head_commit.message == 'release: publish v0.4.76-custom.1'
    name: Build ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build NodeCTL
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-s -w -X 'nodectl/internal/version.Version=${VERSION}'" \
            -o "bin/nodectl-linux-${GOARCH}" ./main.go
          sha256sum "bin/nodectl-linux-${GOARCH}" > "bin/nodectl-linux-${GOARCH}.sha256"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.goarch }}
          path: |
            bin/nodectl-linux-${{ matrix.goarch }}
            bin/nodectl-linux-${{ matrix.goarch }}.sha256
          retention-days: 1

  publish-release:
    if: github.event.head_commit.message == 'release: publish v0.4.76-custom.1'
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-linux-*
          path: bin
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: NodeCTL Custom ${{ env.VERSION }}
          body: |
            基于上游 NodeCTL v0.4.76 的个人定制版本。

            ### 本版本新增
            - 地区自动选择与地区手动选择：香港、日本、新加坡、美国、英国、德国、台湾、韩国、荷兰、波兰、摩尔多瓦、芬兰、印度、泰国、法国、中国大陆
            - 保留 NodeCTL 中转/落地机场模型，地区筛选仅作用于落地节点
            - 新增 默认代理 / GLOBAL 组合策略
            - 新增加密货币分流模块
            - 加入 STUN / WebRTC 常见端口与关键字阻断
            - 本地/私网流量保持直连
            - 未匹配流量最终进入 默认代理
            - 与 NodeCTL 原有 OpenAI、Telegram、YouTube、Twitter(X)、TikTok 等模块兼容

            ### Docker
            `ghcr.io/illria/nodectl:v0.4.76-custom.1`

            同时继续提供：
            - `ghcr.io/illria/nodectl:latest`
            - `ghcr.io/illria/nodectl:custom`
          files: |
            bin/nodectl-linux-amd64
            bin/nodectl-linux-amd64.sha256
            bin/nodectl-linux-arm64
            bin/nodectl-linux-arm64.sha256
          draft: false
          prerelease: false
          generate_release_notes: false

  publish-image:
    if: github.event.head_commit.message == 'release: publish v0.4.76-custom.1'
    name: Publish Versioned Docker Image
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-linux-*
          path: bin
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x bin/nodectl-linux-amd64 bin/nodectl-linux-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
