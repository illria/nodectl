name: Publish Custom Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

env:
  VERSION: v0.4.76-custom.5
  AGENT_VERSION: v0.2.77
  IMAGE: ghcr.io/illria/nodectl

jobs:
  build-panel:
    if: "${{ github.event.head_commit.message == 'release: publish v0.4.76-custom.5' }}"
    name: Build Panel ${{ matrix.goos }} ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            ext: ".exe"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build panel
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-s -w -X 'nodectl/internal/version.Version=${VERSION}'" \
            -o "bin/nodectl-${GOOS}-${GOARCH}${{ matrix.ext }}" ./main.go

      - name: Upload panel artifact
        uses: actions/upload-artifact@v4
        with:
          name: panel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/nodectl-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          retention-days: 1

  build-agent:
    if: "${{ github.event.head_commit.message == 'release: publish v0.4.76-custom.5' }}"
    name: Build Agent ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build agent
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          GIT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-8)
          OUT="bin/nodectl-agent-linux-${GOARCH}-${AGENT_VERSION}"
          go build -trimpath -ldflags="-s -w \
            -X 'nodectl/internal/agent.AgentVersion=${AGENT_VERSION}' \
            -X 'nodectl/internal/agent.UpdateRepoOwner=illria' \
            -X 'nodectl/internal/agent.UpdateRepoName=nodectl' \
            -X 'nodectl/internal/agent.GitCommit=${GIT_SHA}' \
            -X 'nodectl/internal/agent.BuildTime=${BUILD_TIME}'" \
            -o "${OUT}" ./cmd/nodectl-agent/main.go
          sha256sum "${OUT}" > "${OUT}.sha256"

      - name: Upload agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.goarch }}
          path: |
            bin/nodectl-agent-linux-${{ matrix.goarch }}-${{ env.AGENT_VERSION }}
            bin/nodectl-agent-linux-${{ matrix.goarch }}-${{ env.AGENT_VERSION }}.sha256
          retention-days: 1

  publish-release:
    if: "${{ github.event.head_commit.message == 'release: publish v0.4.76-custom.5' }}"
    name: Publish GitHub Release
    needs: [build-panel, build-agent]
    runs-on: ubuntu-latest
    steps:
      - name: Download panel binaries
        uses: actions/download-artifact@v4
        with:
          pattern: panel-*
          path: bin
          merge-multiple: true

      - name: Download agent binaries
        uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          path: bin
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: NodeCTL Custom ${{ env.VERSION }}
          body: |
            illria/nodectl 独立维护版，基于上游 NodeCTL v0.4.76。

            ### v0.4.76-custom.5
            - 修复 DNS 出口与总模式不一致的问题：客户端普通 A/AAAA 查询统一通过总模式发送
            - Fake-IP 网段从 172.20.0.1/16 改为 198.18.0.1/16，避免与 172.16.0.0/12 私网直连规则冲突
            - 删除独立 DNS连接 策略组，避免历史选择导致 DNS 单独走香港/其他地区
            - 删除 direct-nameserver 与 CN nameserver-policy 的普通查询分流，避免中国 DNS 泄漏
            - proxy-server-nameserver 仅保留为代理节点域名 bootstrap，避免代理建立前产生递归解析
            - DoT 853 端口改为跟随总模式
            - 保留 custom.4 的总模式、中转策略、地区成对策略与机场 6 小时自动同步
            - Agent 继续使用 v0.2.77

            ### Docker
            `ghcr.io/illria/nodectl:v0.4.76-custom.5`

            也提供：
            - `ghcr.io/illria/nodectl:latest`
            - `ghcr.io/illria/nodectl:custom`
          files: bin/*
          draft: false
          prerelease: false
          generate_release_notes: false

  publish-image:
    if: "${{ github.event.head_commit.message == 'release: publish v0.4.76-custom.5' }}"
    name: Publish Docker Image
    needs: build-panel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux panel binaries
        uses: actions/download-artifact@v4
        with:
          pattern: panel-linux-*
          path: bin
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x bin/nodectl-linux-amd64 bin/nodectl-linux-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:custom
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
